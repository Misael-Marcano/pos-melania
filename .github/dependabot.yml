# After merging dependency bumps that could affect lockfile-driven doc tooling,
# maintainers may run `npm run verify` from the repository root to confirm checks pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      prod-http-and-lodash:
        dependency-type: production
        patterns:
          - "axios"
          - "follow-redirects"
          - "lodash"
  - package-ecosystem: npm
    directory: /apps/backend
    schedule:
      interval: monthly
    groups:
      prod-http-and-lodash:
        dependency-type: production
        patterns:
          - "axios"
          - "follow-redirects"
          - "lodash"
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: monthly
    groups:
      prod-http-and-lodash:
        dependency-type: production
        patterns:
          - "axios"
          - "follow-redirects"
          - "lodash"
