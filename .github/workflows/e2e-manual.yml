# E2E contra un frontend ya desplegado (staging). No arranca SQL aquí.
# Requiere secrets: E2E_EMAIL, E2E_PASSWORD, PLAYWRIGHT_BASE_URL (ej. https://staging-app.example.com)
# This manual E2E workflow does not run `verify:docs-links` (or root `npm run verify`).
# If a PR also changes `docs/`, run `npm run verify` locally from repo root before merge.
# See CONTRIBUTING.md for the full verify / contribution checklist.
name: E2E Playwright (manual dispatch)

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E
        working-directory: apps/frontend
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
        run: npm run test:e2e
